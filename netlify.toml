[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  REACT_APP_API_URL = "https://attendance-system-api.onrender.com"
  REACT_APP_WS_URL = "wss://attendance-system-api.onrender.com"
  CI = "false"

[dev]
  command = "npm start"
  port = 3000
  framework = "create-react-app"

# Redirect all routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache rules
[[headers]]
  for = "/static/*"
  
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
